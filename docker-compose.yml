version: "3.9"

# =============================================================
# INEN Oncología — BI Dashboard Perú
# Arquitectura multicapa containerizada
#
# Uso:
#   cp docker/.env.example .env
#   docker compose up -d
#   docker compose --profile etl up etl-service   # carga inicial de datos
#
# Compatible con: docker compose v2 y podman compose
# =============================================================

services:

  # ──────────────────────────────────────────────
  # CAPA 1: Data Lake (MinIO — S3 compatible)
  # Consola web: http://localhost:9002
  # ──────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: oncologia-minio
    command: server /data --console-address ":9002"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_2026}
    ports:
      - "${MINIO_API_PORT:-9001}:9000"
      - "${MINIO_CONSOLE_PORT:-9002}:9002"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - oncologia_net
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # CAPA 2: PostgreSQL OLTP (Base Transaccional)
  # Host: localhost  Port: 5433
  # DB: oncologia_oltp  User: oncologia
  # ──────────────────────────────────────────────
  postgres_oltp:
    image: postgres:16-alpine
    container_name: oncologia-oltp
    environment:
      POSTGRES_USER: ${POSTGRES_OLTP_USER:-oncologia}
      POSTGRES_PASSWORD: ${POSTGRES_OLTP_PASSWORD:-oncologia_dev_2026}
      POSTGRES_DB: ${POSTGRES_OLTP_DB:-oncologia_oltp}
    ports:
      - "${POSTGRES_OLTP_PORT:-5433}:5432"
    volumes:
      - postgres_oltp_data:/var/lib/postgresql/data
      - ./docker/postgres-oltp/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OLTP_USER:-oncologia} -d ${POSTGRES_OLTP_DB:-oncologia_oltp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oncologia_net
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # CAPA 3: PostgreSQL OLAP (Data Warehouse)
  # Host: localhost  Port: 5434
  # DB: oncologia_olap  User: oncologia
  # ──────────────────────────────────────────────
  postgres_olap:
    image: postgres:16-alpine
    container_name: oncologia-olap
    environment:
      POSTGRES_USER: ${POSTGRES_OLAP_USER:-oncologia}
      POSTGRES_PASSWORD: ${POSTGRES_OLAP_PASSWORD:-oncologia_dev_2026}
      POSTGRES_DB: ${POSTGRES_OLAP_DB:-oncologia_olap}
    ports:
      - "${POSTGRES_OLAP_PORT:-5434}:5432"
    volumes:
      - postgres_olap_data:/var/lib/postgresql/data
      - ./docker/postgres-olap/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OLAP_USER:-oncologia} -d ${POSTGRES_OLAP_DB:-oncologia_olap}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oncologia_net
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # CAPA 4a: MongoDB (NoSQL Documental)
  # URI: mongodb://admin:password@localhost:27018
  # DB: oncologia_docs
  # ──────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: oncologia-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin_dev_2026}
      MONGO_INITDB_DATABASE: oncologia_docs
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongodb/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - oncologia_net
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # CAPA 4b: Redis (Caché In-Memory)
  # Host: localhost  Port: 6380
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: oncologia-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - oncologia_net
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # CAPA 4c: Neo4j (Base de Datos de Grafos)
  # Browser: http://localhost:7475
  # Bolt:    bolt://localhost:7688
  # User: neo4j
  # ──────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: oncologia-neo4j
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-oncologia_graph_2026}"
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 768m
      NEO4J_dbms_memory_pagecache_size: 256m
    ports:
      - "${NEO4J_HTTP_PORT:-7475}:7474"
      - "${NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-oncologia_graph_2026}", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - oncologia_net
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # CAPA 6: Ollama (LLM Local)
  # API: http://localhost:11435
  # Modelos: gemma3:1b, nomic-embed-text
  # ──────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: oncologia-ollama
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - oncologia_net
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # CAPA 7: Python Analytics (Minería + NLP + API)
  # API: http://localhost:8001
  # ──────────────────────────────────────────────
  python-analytics:
    build:
      context: ./docker/python-analytics
      dockerfile: Dockerfile
    container_name: oncologia-analytics
    environment:
      POSTGRES_OLTP_HOST: postgres_oltp
      POSTGRES_OLAP_HOST: postgres_olap
      POSTGRES_USER: ${POSTGRES_OLTP_USER:-oncologia}
      POSTGRES_PASSWORD: ${POSTGRES_OLTP_PASSWORD:-oncologia_dev_2026}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-admin_dev_2026}@mongodb:27017
      REDIS_HOST: redis
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-oncologia_graph_2026}
      OLLAMA_HOST: http://ollama:11434
    ports:
      - "${PYTHON_ANALYTICS_PORT:-8001}:8001"
    depends_on:
      postgres_oltp:
        condition: service_healthy
      postgres_olap:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./docker/python-analytics/scripts:/app/scripts
    networks:
      - oncologia_net
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # CAPA 8: ETL Service (carga inicial de datos)
  # Solo se ejecuta con: docker compose --profile etl up etl-service
  # ──────────────────────────────────────────────
  etl-service:
    build:
      context: ./docker/etl-service
      dockerfile: Dockerfile
    container_name: oncologia-etl
    environment:
      POSTGRES_OLTP_HOST: postgres_oltp
      POSTGRES_OLTP_PORT: "5432"
      POSTGRES_OLTP_DB: ${POSTGRES_OLTP_DB:-oncologia_oltp}
      POSTGRES_OLTP_USER: ${POSTGRES_OLTP_USER:-oncologia}
      POSTGRES_OLTP_PASSWORD: ${POSTGRES_OLTP_PASSWORD:-oncologia_dev_2026}
      POSTGRES_OLAP_HOST: postgres_olap
      POSTGRES_OLAP_PORT: "5432"
      POSTGRES_OLAP_DB: ${POSTGRES_OLAP_DB:-oncologia_olap}
      POSTGRES_OLAP_USER: ${POSTGRES_OLAP_USER:-oncologia}
      POSTGRES_OLAP_PASSWORD: ${POSTGRES_OLAP_PASSWORD:-oncologia_dev_2026}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-admin_dev_2026}@mongodb:27017
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-oncologia_graph_2026}
    depends_on:
      postgres_oltp:
        condition: service_healthy
      postgres_olap:
        condition: service_healthy
    volumes:
      - ./db/oncologia:/app/data:ro
    networks:
      - oncologia_net
    restart: "no"
    profiles:
      - etl

  # ──────────────────────────────────────────────
  # CAPA 9: Next.js Frontend
  # App: http://localhost:3000
  # ──────────────────────────────────────────────
  nextjs:
    build:
      context: .
      dockerfile: docker/Dockerfile.nextjs
    container_name: oncologia-frontend
    environment:
      POSTGRES_OLTP_HOST: postgres_oltp
      POSTGRES_OLAP_HOST: postgres_olap
      POSTGRES_USER: ${POSTGRES_OLTP_USER:-oncologia}
      POSTGRES_PASSWORD: ${POSTGRES_OLTP_PASSWORD:-oncologia_dev_2026}
      POSTGRES_OLAP_USER: ${POSTGRES_OLAP_USER:-oncologia}
      POSTGRES_OLAP_PASSWORD: ${POSTGRES_OLAP_PASSWORD:-oncologia_dev_2026}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-admin_dev_2026}@mongodb:27017
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-oncologia_graph_2026}
      OLLAMA_HOST: http://ollama:11434
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NODE_ENV: production
    ports:
      - "${NEXTJS_PORT:-3000}:3000"
    depends_on:
      postgres_olap:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oncologia_net
    restart: unless-stopped

# ──────────────────────────────────────────────
# VOLÚMENES PERSISTENTES
# ──────────────────────────────────────────────
volumes:
  minio_data:
  postgres_oltp_data:
  postgres_olap_data:
  mongo_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  ollama_data:

# ──────────────────────────────────────────────
# RED INTERNA
# ──────────────────────────────────────────────
networks:
  oncologia_net:
    driver: bridge
